[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools >= 64", "setuptools-scm>=8"]

[tool.setuptools_scm]
git_describe_command = "git describe --long --first-parent"
root = "../.."

[tool.setuptools]
packages = ["nat_clausefinder_3gpp"]
package-dir = { "" = "src" }

[tool.uv]
prerelease = "allow"

[project]
name = "nat_clausefinder_3gpp"
dynamic = ["version"]
requires-python = ">=3.11,<3.14"
description = "Clause-cited 3GPP spec Q&A with an abstention gate, over the GSMA Open Telco corpus"
dependencies = [
    "nvidia-nat[langchain,test]~=1.8",
    "huggingface-hub~=0.34",
    "numpy~=2.1",
    "openai~=2.6",
]
keywords = ["ai", "agents", "rag", "telecom", "3gpp", "citations", "abstention"]
classifiers = ["Programming Language :: Python"]
authors = [{ name = "chinthave657" }]

[project.entry-points.'nat.components']
nat_clausefinder_3gpp = "nat_clausefinder_3gpp.register"
