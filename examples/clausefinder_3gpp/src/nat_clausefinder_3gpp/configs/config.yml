functions:
  threegpp_clause_search:
    _type: threegpp_clause_search
    index_dir: data/index
    top_k: 6
    abstain_threshold: 0.42

llms:
  nim_llm:
    _type: nim
    model_name: nvidia/nemotron-3-nano-30b-a3b
    temperature: 0.0
    max_tokens: 2048

workflow:
  _type: react_agent
  llm_name: nim_llm
  tool_names: [threegpp_clause_search]
  # Nemotron supports native (OpenAI-style) tool calling; it is far more
  # reliable than parsing ReAct-formatted text out of a reasoning model.
  use_native_tool_calling: true
